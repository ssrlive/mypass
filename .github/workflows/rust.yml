name: Rust

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  DB_PATH: ${{ github.workspace }}/res/test_db_with_password.kdbx
  PASSWORD: demopass

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            host_os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            host_os: ubuntu-22.04-arm
          - target: x86_64-apple-darwin
            host_os: macos-latest
          - target: aarch64-apple-darwin
            host_os: macos-latest
          - target: x86_64-pc-windows-msvc
            host_os: windows-latest
          - target: i686-win7-windows-msvc
            host_os: windows-latest
            build_nightly: true

    runs-on: ${{ matrix.host_os }}

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Prepare
        shell: bash
        run: |
          if [[ "${{ matrix.target }}" != "i686-win7-windows-msvc" ]]; then
            rustup target add ${{ matrix.target }}
          fi

      - name: Install packages (Linux)
        if: runner.os == 'Linux'
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev libgtk-3-dev libxdo-dev libayatana-appindicator3-dev
          version: 1.0
          execute_install_scripts: true

      - name: Rustfmt
        if: ${{ !cancelled() }}
        run: cargo fmt --all -- --check

      - name: Clippy
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          if [[ "${{ matrix.build_nightly }}" != "true" ]]; then
            cargo clippy --release --all-features --target ${{ matrix.target }} -- -D warnings
          fi

      - name: check --all-features
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          if [[ "${{ matrix.build_nightly }}" != "true" ]]; then
            cargo check --release --all-features --target ${{ matrix.target }}
          fi
      - name: Build
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          if [[ "${{ matrix.build_nightly }}" == "true" ]]; then
            rustup toolchain install nightly
            rustup component add rust-src --toolchain nightly
            cargo +nightly build --release -Z build-std --target ${{ matrix.target }}
          else
            cargo build --release --verbose --all-features --target ${{ matrix.target }}
          fi

      - name: Run tests
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          if [[ "${{ matrix.build_nightly }}" != "true" ]]; then
            cargo test --release --verbose --all-features --target ${{ matrix.target }}
          fi
